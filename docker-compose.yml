services:
    app:
        build:
            args:
                gid: ${GROUP_ID}
                uid: ${USER_ID}
            context: ./
            dockerfile: Dockerfile
        image: articles
        container_name: ${CONTAINER_NAME}_app
        restart: unless-stopped
        working_dir: /var/www/html
        # The entrypoint's switches (docker/entrypoint.sh). Compose only reads .env
        # to fill in this file, so without this list none of them ever reached the
        # container. DB_FRESH_ON_BOOT is left out on purpose: a `true` forgotten in
        # .env would wipe the database on the next restart. To rebuild a local
        # database: docker compose exec app php artisan migrate:fresh --seed --force
        environment:
            RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
            SEED_IF_EMPTY: ${SEED_IF_EMPTY:-true}
            BUILD_ASSETS: ${BUILD_ASSETS:-missing}
            INSTALL_DEPS: ${INSTALL_DEPS:-true}
            CACHE_CONFIG: ${CACHE_CONFIG:-true}
            RUN_WORKERS: ${RUN_WORKERS:-true}
            DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
        volumes:
            - ./:/var/www/html
        networks:
            - net


    webserver:
        image: nginx:1.29-alpine
        container_name: ${CONTAINER_NAME}_nginx
        restart: unless-stopped
        ports:
            - 127.0.0.1:${NGINX_EXPOSE_PORT}:80
        volumes:
            - ./:/var/www/html
            - ./docker/nginx:/etc/nginx/conf.d/
        networks:
            - net

    db:
        image: postgres:17.6-alpine
        container_name: ${CONTAINER_NAME}_db
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            PGDATA: /var/lib/postgresql/data
        volumes:
            - ./docker/volumes/postgres/data:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:${POSTGRES_EXPOSE_PORT}:5432
        networks:
            - net

    redis:
        image: redis:8.2-alpine
        container_name: ${CONTAINER_NAME}_redis
        restart: always
        ports:
            - 127.0.0.1:${REDIS_EXPOSE_PORT}:6379
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        volumes:
            - ./docker/volumes/redis:/data
        networks:
            - net

networks:
    net:
        driver: bridge
