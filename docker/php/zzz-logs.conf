; php-fpm logging, adjusted for running under PM2.
;
; The base image's docker.conf sets `error_log = /proc/self/fd/2`, which assumes
; php-fpm is PID 1 with a real stderr. Under PM2 the child's stderr is a pipe and
; php-fpm cannot open it, failing at startup with:
;
;   ERROR: failed to open error_log (/proc/self/fd/2): No such device or address
;
; Logging to a file fixes that. Fatal startup messages are still written to stderr
; before this log is opened, so PM2 captures them and they remain visible in
; `docker compose logs`.
;
; Filename starts with zzz so it is included after docker.conf and wins.

[global]
error_log = /var/www/html/storage/logs/php-fpm.log

[www]
; docker.conf points this at /proc/self/fd/2 as well, and it fails for the same
; reason. nginx already writes request logs, so this is the fpm-side view only.
access.log = /var/www/html/storage/logs/php-fpm-access.log

; Send anything workers write to stdout/stderr to the error log above, instead of
; discarding it. Without this, notices from PHP itself vanish.
catch_workers_output = yes

; PM2 already timestamps each line; fpm's own prefix would double it up.
decorate_workers_output = no
